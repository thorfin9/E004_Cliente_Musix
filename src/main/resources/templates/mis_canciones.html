<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Musix - Mis canciones</title>
	<link rel="stylesheet" th:href="@{/styles/musix.css}">
</head>
<body>
	<header th:replace="~{includes/plantilla.html::cabecera}"></header>
	<nav th:replace="~{includes/plantilla.html::menu}"></nav>
	<main>
		<section>
			<h2>Mis canciones</h2>
			<article th:if="${f_mensaje}" id="cajaMensajes"><h2 th:text="${f_mensaje}"></h2></article>

			<form class="formAncho" method="post" th:action="@{/guardarCancion}" th:object="${objCancion}">
				<h2 th:text="${objCancion.id == null ? 'Añadir canción' : 'Editar canción'}"></h2>
				<input type="hidden" th:field="*{id}">

				<label>Título:</label>
				<input type="text" th:field="*{titulo}" maxlength="100" required>

				<label>Enlace de YouTube:</label>
				<input type="url" th:field="*{enlace}" placeholder="https://www.youtube.com/watch?v=..." required>

				<label>Duración (segundos):</label>
				<input type="number" th:field="*{duracion}" min="1" required>

				<label>Estilo:</label>
				<select th:field="*{estiloFk.id}" required>
					<option value="">-- elige un estilo --</option>
					<option th:each="e : ${listaEstilos}" th:value="${e.id}" th:text="${e.nombre}"></option>
				</select>

				<label>Descripción:</label>
				<textarea th:field="*{descripcion}" rows="3"></textarea>

				<input type="submit" value="Guardar">
				<a th:if="${objCancion.id != null}" th:href="@{/misCanciones}">Cancelar edición</a>
			</form>

			<h2>Mis canciones subidas</h2>
			<p th:if="${#arrays.isEmpty(canciones)}">Todavía no has subido ninguna.</p>
			<table class="tabla" th:unless="${#arrays.isEmpty(canciones)}">
				<tr><th>Título</th><th>Estilo</th><th>Duración</th><th>Reportada</th><th></th></tr>
				<tr th:each="c : ${canciones}">
					<td><a th:href="${c.enlace}" target="_blank" rel="noopener" th:text="${c.titulo}"></a></td>
					<td th:text="${c.estiloFk.nombre}"></td>
					<td th:text="${c.duracion / 60} + ':' + ${#numbers.formatInteger(c.duracion % 60, 2)}"></td>
					<td th:text="${c.reportada} ? 'Sí' : 'No'"></td>
					<td>
						<a class="btnCancion" th:href="@{/editarCancion/{id}(id=${c.id})}">Editar</a>
						<a class="btnCancion" th:href="@{/borrarCancion/{id}(id=${c.id})}"
						   onclick="return confirm('¿Borrar la canción?')">Borrar</a>
					</td>
				</tr>
			</table>
		</section>
	</main>
	<footer th:replace="~{includes/plantilla.html::pie}"></footer>
</body>
</html>
