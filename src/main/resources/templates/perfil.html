<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Musix - Perfil</title>
		<link rel="stylesheet" th:href="@{/styles/musix.css}">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
		<script th:src="@{/js/sha256login2.js}"></script>
		<script th:src="@{/js/validarPerfil.js}"></script>
	</head>
<body>
	<header th:replace="~{includes/plantilla.html::cabecera}"></header>
	<nav th:replace="~{includes/plantilla.html::menu}"></nav>
	<main>
		<section>
			<form class="formAncho" method="post" th:action="@{/guardarPerfil}" th:object="${objUsuario}"
				enctype="multipart/form-data" onsubmit="return validarPerfil()">

				<article th:if="${f_mensaje}" id="cajaMensajes"><h2 th:text="${f_mensaje}"></h2></article>

				<h2>Mi perfil</h2>
				<img class="avatar" th:src="${session.urlFotos + session.usuario.foto}" alt="foto">

				<label for="user">Usuario:</label>
				<input type="text" th:field="*{user}" required>

				<label for="pass_sin_hash">Nueva contraseña (vacío = no cambiarla):</label>
				<input type="password" id="pass_sin_hash" oninput="calcularSha256()">
				<label for="repetir">Repetir contraseña:</label>
				<input type="password" id="repetir">
				<input type="hidden" th:field="*{pass}">

				<label for="archivoFoto">Cambiar foto:</label>
				<input type="file" id="archivoFoto" name="archivoFoto" accept="image/png,image/jpeg,image/gif,image/webp">

				<p class="subtitulo">Para cambiar tus preguntas, escribe de nuevo las 3 respuestas. Si las dejas vacías no se modifican.</p>
				<div class="bloquePregunta" th:each="i : ${#numbers.sequence(0, 2)}">
					<label th:text="'Pregunta ' + ${i + 1} + ':'"></label>
					<select class="selectPregunta" th:field="*{preguntas[__${i}__].preguntaFk.id}" required>
						<option value="">-- elige una pregunta --</option>
						<option th:each="p : ${listaPreguntas}" th:value="${p.id}" th:text="${p.texto}"></option>
					</select>
					<input type="text" th:field="*{preguntas[__${i}__].respuesta}" placeholder="Tu respuesta">
				</div>

				<input type="submit" value="Guardar cambios">
			</form>
		</section>
	</main>
	<footer th:replace="~{includes/plantilla.html::pie}"></footer>
</body>
</html>
